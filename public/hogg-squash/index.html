<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- no zooming or scrolling on phones (S11b); viewport-fit so the controls can keep clear of a notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Hogg Squash</title>
  <style>
    /* the page matches the court's margin colour, so the bars around a 16:9 game don't show as a box */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #16161a; }
    body { display: grid; place-items: center; touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; image-rendering: pixelated; }
    [hidden] { display: none !important; }

    /* touch controls (js/input/touch.js): over the canvas, see-through so the court shows under them */
    #touch { position: fixed; inset: 0; pointer-events: none; font: bold 15px system-ui, sans-serif; color: #fff; }
    #touch > * { position: absolute; pointer-events: auto; box-sizing: border-box; border-radius: 50%;
      display: grid; place-items: center; border: 2px solid rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.12); text-shadow: 0 1px 2px #000; }
    #touch > .on { background: rgba(255, 255, 255, 0.35); }
    #stick { --d: min(42vh, 170px); width: var(--d); height: var(--d);
      left: calc(14px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom)); }
    #stick .knob { width: 42%; height: 42%; border-radius: 50%; background: rgba(255, 255, 255, 0.4);
      pointer-events: none; }
    #hard, #soft { --d: min(26vh, 104px); width: var(--d); height: var(--d); }
    #hard { right: calc(14px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom));
      background: rgba(200, 16, 46, 0.45); border-color: rgba(255, 160, 170, 0.6); }
    #hard.on { background: rgba(200, 16, 46, 0.8); }
    #soft { right: calc(14px + env(safe-area-inset-right) + var(--d) * 1.1);
      bottom: calc(14px + env(safe-area-inset-bottom) + var(--d) * 0.55); }
    #pause, #full { width: 44px; height: 44px; top: calc(8px + env(safe-area-inset-top)); font-size: 16px; }
    #pause { left: calc(8px + env(safe-area-inset-left)); }
    #full { right: calc(8px + env(safe-area-inset-right)); }

    /* touch is played sideways: a portrait phone gets a message instead of the game */
    #turn { display: none; }
    @media (orientation: portrait) {
      html.touch #turn { display: grid; place-items: center; position: fixed; inset: 0; background: #16161a;
        color: #eee; font: bold 22px system-ui, sans-serif; text-align: center; padding: 24px; }
      html.touch #touch { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="game" width="640" height="360"></canvas>
  <div id="touch" hidden>
    <div id="stick"><div class="knob"></div></div>
    <div id="soft">SOFT</div>
    <div id="hard">HARD</div>
    <div id="pause" aria-label="Pause">II</div>
    <div id="full" aria-label="Fullscreen">[ ]</div>
  </div>
  <div id="turn">Turn your phone sideways to play</div>
  <noscript><p style="color:#eee;font-family:system-ui">Hogg Squash needs JavaScript.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
